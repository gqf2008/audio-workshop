# 三平台门禁：填上「本机只有 macOS」这个缺口。
#
# 背景：docs/m3-platform-status.md 记录过——本机交叉编译到 Linux GNU / Windows MSVC
# 都会卡在 ring 的 C 工具链（macOS 上没有目标 sysroot），只有 Colima 容器里的 Linux
# `cargo check` 与 Windows GNU 交叉 check 能过。M3 的关闭判据是「第二个平台可自用」，
# 需要真机；在拿到真机之前，这套矩阵至少把**编译/clippy/单测**这三件在真机上跑。
#
# 成本提醒：仓库是私有的，私有仓库的 Actions 会消耗账号额度。workflow_dispatch 与
# pull_request/push 都会触发；额度策略未定前不要在每次提交都依赖它。
name: ci

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧的进行中任务，别让排队吃掉私有仓库额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 让 clippy/测试失败时的回溯可读（不带会只剩一行 panic 位置）。
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台红了也要看到另外两个的结果——这正是本矩阵存在的意义。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Slint 的 Linux 后端（x11/wayland）、ALSA、fontconfig —— 照
      # docs/m3-platform-status.md 里已在容器中验证过的那份清单。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # libssl-dev 是显式的：stem-splitter-core → reqwest → hyper-tls →
          # native-tls → openssl-sys 在 Linux 上会真编 openssl。ubuntu-24.04 runner
          # 恰好预装了它，但依赖 runner 镜像的隐式预装是脆的，写出来。
          sudo apt-get install -y -qq \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libfontconfig1-dev libssl-dev clang

      # components 里带上 rustfmt/clippy —— 否则下面两条会以「命令不存在」失败，
      # 那会被误读成代码有问题。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo registry / git / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # release 构建也必须过。`#[cfg(debug_assertions)]` 的项在 debug 下是存在的，
      # 所以 fmt / clippy / test 都发现不了「调用点没加 cfg、函数在 release 里被编掉」
      # 这类断口 —— 2026-09-18 就踩过一次（seed_shot_batch 漏 cfg，cargo build
      # --release 报 E0425，而整条 debug 门禁全绿）。发版前必须能出 release 二进制。
      - name: cargo build --release
        run: cargo build --release

      # python 单测依赖 pyyaml。第一轮真跑时 ubuntu 因 runner 镜像预装了 pyyaml 而绿，
      # macOS 的 homebrew python 没有它，`import yaml` 直接 ModuleNotFoundError。
      # 根因是 CI 从没装项目自己的 python 依赖，所以在这步显式补上。
      #
      # --break-system-packages 为什么必须有：
      #   macOS 的 python3 是 homebrew 装的（/opt/homebrew/Cellar/python@...），
      #   ubuntu 的 python3 是系统 python —— 两者都是 PEP 668 externally-managed。
      #   pip>=23.0 起，`--user` 不再绕过这个检查，单独 `--user` 照样被拒成
      #   externally-managed-environment；只有 --break-system-packages 能关掉它。
      # --user 为什么还要加：
      #   关掉检查后如果不加 --user，会把包装进 homebrew/系统自己的 site-packages，
      #   这正是 homebrew 报错里 STRONGLY 建议避免的；--user 装到用户目录，
      #   不碰 brew/系统 site-packages（homebrew 推荐组合就是 --user + 该开关）。
      # 对 ubuntu：pyyaml 已预装时这步是幂等的（Requirement already satisfied，退出 0），
      #   不会把现在已绿的 ubuntu 改坏。
      # 装不上就该红：不加 `|| true` / continue-on-error。
      - name: 安装 python 依赖（pyyaml）
        if: runner.os != 'Windows'
        run: python3 -m pip install --user --break-system-packages pyyaml

      # Windows runner 的解释器叫 python（python3 不在 PATH 里），照下面单测那两步
      # 同样的按 runner.os 拆分。Windows 的 CPython 不是 externally-managed，
      # 不需要 --break-system-packages；--user 同样避免写系统目录。
      - name: 安装 python 依赖（pyyaml，Windows）
        if: runner.os == 'Windows'
        run: python -m pip install --user pyyaml

      # Windows 的 GitHub runner 上解释器叫 python（python3 不在 PATH 里）；
      # 这不是「跳过测试」，两边跑的是同一条 unittest 命令。
      - name: python 单测
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tools/tests

      - name: python 单测（Windows）
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools/tests
