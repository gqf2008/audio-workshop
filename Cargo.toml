[package]
name = "audio-workshop"
version = "0.1.9"
edition = "2021"
license = "Apache-2.0"
description = "音频作坊：本地优先的音频工作台（配音 / BGM / 歌曲），配音先行"
build = "build.rs"

[dependencies]
# GUI：Rust + Slint 1.18。渲染走默认 femtovg（OpenGL）；macOS 上 Metal 由系统 GL 层接管。
# `unstable-winit-030`：无边框自绘标题栏要拿 winit 窗口做拖拽/最小化/最大化/缩放
# （slint-pixel 的 install_title_bar_controls / install_window_resize 依赖它）。
slint = { version = "1.18", features = ["unstable-winit-030"] }
# 像素风组件库：全部界面控件经 `@slint_pixel` 导入（Pixel* 前缀），无 std-widgets 控件。
slint-pixel = "0.2.3"
# 配音链路核心（切句/文本兜底/逐句合成/拼装），与 Python tools/ 行为由 parity 夹具固定。
aw-core = { path = "crates/aw-core" }
# 校听播放（rodio → macOS CoreAudio）。只播本地 wav：逐句试听播 sentences/xxx.wav，
# 全篇试听播 out/final.wav。
rodio = { version = "0.20", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# HTTP 客户端：**与 aw-core 共用同一份 ureq 2.x**，别再引第三个 HTTP 栈。
#   · 模型权重下载（M4-P7）：流式读响应写到 .part，支持 Range 续传；
#   · 检查更新（M4-P8）：只读拉一份发布清单。
# 两条路径都只用 ureq 2 的 timeout_connect / timeout_read（per-read），**不设总超时**。
ureq = "2"
# 进程监护用：`kill(pid, 0)` 探活 + SIGTERM/SIGKILL（见 engine_supervisor::run_monitor）。
# 只在 Unix 上用到，Windows 那份是空实现。
libc = "0.2"
dirs = "6"
# Linux: 让 Slint/fontique 运行时 dlopen fontconfig，避免发布包硬链某一版
# libfontconfig，也便于在 macOS 上做 Linux 交叉 check。
# **版本必须与 Slint 内嵌的 fontique 对齐**：Cargo 的 feature unification 会让
# yeslogic-fontconfig-sys 共享一份；只给 0.10 开 dlopen、而 Slint 的 0.11.1 没开时，
# 0.11.1 会走非 dlopen 的根导入并在 Linux 编译失败（CI E0432）。
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }

# Windows 打开外部链接走 ShellExecuteW（见 open_external_url_windows）：**不经 cmd**——
# cmd.exe /C 会把 URL 里的 `&` 等元字符再解析成第二条命令（命令注入 + 常见 URL 截断）。
# 版本对齐 Cargo.lock 里已有的 0.61.2（ureq 的 mio/schannel 已拉同一份），不新增重复版本；
# **门控在 target 上**，macOS/Linux 构建完全不拉这个依赖。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[build-dependencies]
slint-build = "1.18"
# build.rs 需要 slint_pixel::library_paths() 注册 `@slint_pixel` 库路径。
slint-pixel = "0.2.3"

# Windows 目标的 exe 图标资源（build.rs 里把 assets/icon.ico 编进 PE 资源段）。
# **故意不加 `[target.'cfg(windows)']` 门控**：那样在非 Windows 宿主机上编译 build.rs 时
# 这个 crate 根本不在 extern 表里，代码里连写 `embed_resource::` 都过不了编译（实测
# E0433）—— 而"哪个目标平台要资源"本来就是**目标**属性（CARGO_CFG_TARGET_OS），
# 由 build.rs 在运行时判（见 embed_windows_icon）。
# 工具链：MSVC 走 Windows SDK 的 rc.exe（embed-resource 自己去注册表/Windows Kits 找，
# 不依赖 PATH）、windows-gnu 走 windres。
#
# 已知代价：macOS/Linux 上构建也会多编这个 build-dep（cc/memchr/toml/rustc_version），
# 换来的是"跨平台编译到 windows 目标也能嵌图标"这条路径真的可达。
embed-resource = "3"

# Cargo 工作区。当前成员：aw-core 核心库（配音链路/文本兜底/服务客户端）。
# 后续批量/模板等能力（CHARTER 第 9 节 M4）再拆成员 crate，往 members 里加即可。
[workspace]
resolver = "2"
members = ["crates/aw-core"]

[profile.release]
opt-level = "z"
lto = "thin"
strip = true

# 统一控件描边宽度：0.2.3 增加 PixelTheme.border-width；在 crates.io 正式发布前先用
# 固定 git rev，保证 CI 与本机拿到同一份组件实现。
[patch.crates-io]
slint-pixel = { git = "https://github.com/gqf2008/slint-pixel", rev = "63b34c4d58d675db2c4c7d63eb8552a6cc993dd4" }
