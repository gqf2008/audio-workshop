[package]
name = "audio-workshop"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "音频作坊：本地优先的音频工作台（配音 / BGM / 歌曲），配音先行"
build = "build.rs"

[dependencies]
# GUI：Rust + Slint 1.18。渲染走默认 femtovg（OpenGL）；macOS 上 Metal 由系统 GL 层接管。
# `unstable-winit-030`：无边框自绘标题栏要拿 winit 窗口做拖拽/最小化/最大化/缩放
# （slint-pixel 的 install_title_bar_controls / install_window_resize 依赖它）。
slint = { version = "1.18", features = ["unstable-winit-030"] }
# 像素风组件库：全部界面控件经 `@slint_pixel` 导入（Pixel* 前缀），无 std-widgets 控件。
slint-pixel = "0.2.2"
# 配音链路核心（切句/文本兜底/逐句合成/拼装），与 Python tools/ 行为由 parity 夹具固定。
aw-core = { path = "crates/aw-core" }
# 校听播放（rodio → macOS CoreAudio）。只播本地 wav：逐句试听播 sentences/xxx.wav，
# 全篇试听播 out/final.wav。
rodio = { version = "0.20", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# HTTP 客户端：**与 aw-core 共用同一份 ureq 2.x**，别再引第三个 HTTP 栈。
#   · 模型权重下载（M4-P7）：流式读响应写到 .part，支持 Range 续传；
#   · 检查更新（M4-P8）：只读拉一份发布清单。
# 两条路径都只用 ureq 2 的 timeout_connect / timeout_read（per-read），**不设总超时**。
ureq = "2"
dirs = "6"
# Linux: 让 Slint/fontique 运行时 dlopen fontconfig，避免发布包硬链某一版
# libfontconfig，也便于在 macOS 上做 Linux 交叉 check。
# **版本必须与 Slint 内嵌的 fontique 对齐**：Cargo 的 feature unification 会让
# yeslogic-fontconfig-sys 共享一份；只给 0.10 开 dlopen、而 Slint 的 0.11.1 没开时，
# 0.11.1 会走非 dlopen 的根导入并在 Linux 编译失败（CI E0432）。
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18"
# build.rs 需要 slint_pixel::library_paths() 注册 `@slint_pixel` 库路径。
slint-pixel = "0.2.2"

# Cargo 工作区。当前成员：aw-core 核心库（配音链路/文本兜底/服务客户端）。
# 后续批量/模板等能力（CHARTER 第 9 节 M4）再拆成员 crate，往 members 里加即可。
[workspace]
resolver = "2"
members = ["crates/aw-core"]

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
